<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>little cloud claw club</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
<h1>little cloud claw club</h1>
<p class="intro">pocket arcade. plays are free, claw is not fair.</p>

<div class="layout">
<section class="machine">
<p class="marquee"><small>one more try?</small> plushies in the back</p>

<div class="window">
<canvas id="game" width="400" height="330"></canvas>
<p class="banner">pick a little friend</p>
</div>

<p id="status">line it up, then drop</p>
<div class="buttons">
<button id="left" type="button" aria-label="Move claw left">←</button>
<button id="drop" type="button">drop</button>
<button id="right" type="button" aria-label="Move claw right">→</button>
</div>

<div class="bottom">
<span>free plays</span>
<div class="chute">prize door</div>
</div>
</section>

<aside class="shelf">
<h2>brought home</h2>
<p class="sub"><span id="count">0</span> / 6</p>
<div id="collection"></div>
<p class="note">arrows move it. space drops. buttons do the same thing.</p>
<button id="restock" type="button">refill the pile</button>
</aside>
</div>

<p class="footer">2026 · mina</p>
</main>
<script src="script.js"></script>
</body>
</html>
